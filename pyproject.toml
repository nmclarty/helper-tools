[project]
name = "helper-tools"
version = "3.2.2"
description = "Tools for automating/enhancing NixOS (and other) system tasks."
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
    "pydantic-settings>=2.16.2",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
helper-tools = "helper_tools.__main__:main"


[build-system]
requires = ["uv_build>=0.10.0"]
build-backend = "uv_build"

